name: Bug report
description: Something broke
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Cog & Cultivar version
    validations:
      required: true
  - type: input
    id: create
    attributes:
      label: Create and NeoForge versions
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options: [Singleplayer, Dedicated server, Both, Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Link latest.log / crash report (mclo.gs or a gist). For server issues include the server log too.
