name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Create ${{ matrix.create }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # First entry is the compile baseline (oldest supported). Others must also build and pass tests.
        create: ['6.0.10-281', '6.0.11-320']
    env:
      CREATE: -Pcreate_version=${{ matrix.create }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and checks (includes client/server sidedness guard)
        run: ./gradlew build --no-daemon $CREATE

      - name: Every shipped cross is breedable
        run: python3 tools/data/check_crosses.py

      - name: Ponder lang matches the scenes
        run: python3 tools/ponder/ponder_lang.py --check

      - name: Datagen is up to date
        if: matrix.create == '6.0.10-281'
        run: |
          ./gradlew runData --no-daemon
          git add -N src/generated
          if ! git diff --exit-code -- src/generated; then
            echo "::error::Generated data is stale. Run ./gradlew runData and commit src/generated."
            exit 1
          fi

      - name: Dedicated server game tests (with optional compat mods)
        run: ./gradlew runGameTestServer --no-daemon $CREATE

      - name: Dedicated server game tests (without optional compat mods)
        if: matrix.create == '6.0.10-281'
        run: ./gradlew runGameTestServer --no-daemon $CREATE -Pwith_delight=false

      - uses: actions/upload-artifact@v5
        if: matrix.create == '6.0.10-281'
        with:
          name: cultivar-jar
          path: build/libs/*.jar
