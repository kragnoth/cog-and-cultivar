name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, checks, datagen, dedicated-server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and checks (includes client/server sidedness guard)
        run: ./gradlew build --no-daemon

      - name: Datagen is up to date
        run: |
          ./gradlew runData --no-daemon
          git add -N src/generated
          if ! git diff --exit-code -- src/generated; then
            echo "::error::Generated data is stale. Run ./gradlew runData and commit src/generated."
            exit 1
          fi

      - name: Dedicated server game tests
        run: ./gradlew runGameTestServer --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: cultivar-jar
          path: build/libs/*.jar
