org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.219
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Dependencies
create_version=6.0.10-281
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.82
flywheel_version=1.0.6
vanillin_version=1.1.3-41
registrate_version=MC1.21-1.3.0+67

# Optional integrations (dev runtime + compile-only APIs)
jade_version=15.10.6+neoforge
jei_version=19.21.0.247
# Optional compat (compileOnly; also in the dev runtime unless -Pwith_delight=false).
# Modrinth version IDs, not numbers: numbers can resolve to the Fabric build. FD 1.21.1-1.3.4, ED 0.1.4, RD 1.7.1, MND 1.10.4.1.
farmers_delight_version=XTVZDOol
expanded_delight_version=RTRYPIJp
rustic_delight_version=sAaG4pSA
my_nethers_delight_version=SGFJBL5q

# Mod
mod_id=cultivar
mod_name=Cog & Cultivar
mod_license=MIT
# Version = <mod_version_base>.<patch>. The patch is computed by build.gradle from git: the number of commits since
# mod_version_base last changed, so every merged PR (one squash commit) bumps it by one. Edit the base for a minor or
# major release (0.3, 1.0...) and the patch restarts at 0.
mod_version_base=0.2
mod_group_id=com.kragnoth.cultivar
mod_authors=Kragnoth
mod_description=Crop genetics and breeding for steampunk and dieselpunk worlds, built on Create.
