plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

// Auto version: <mod_version_base>.<commits since the base was last changed in gradle.properties>.
// Builds without git history (source zip, shallow clone) fall back to patch 0 with a -nogit suffix.
def git = { List<String> args ->
    try {
        def proc = (['git'] + args).execute(null, rootDir)
        def out = proc.text.trim()
        proc.waitFor() == 0 && out ? out : null
    } catch (ignored) {
        null
    }
}
def versionBump = git(['log', '-n', '1', '--format=%H', '-G', '^mod_version_base=', '--', 'gradle.properties'])
def versionPatch = versionBump ? git(['rev-list', '--count', "${versionBump}..HEAD"]) : null
version = versionPatch != null ? "${mod_version_base}.${versionPatch}" : "${mod_version_base}.0-nogit"
ext.mod_version = version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Ponder, Flywheel
    maven { url = 'https://maven.createmod.net' }
    // Registrate (transitive dependency of Create)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // JEI
    maven { url = 'https://maven.blamejared.com' }
    // Modrinth maven (Jade)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // NeoForge config API port (transitive dependency of Ponder)
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Non-transitive: some Create POMs leak optional compat mods (JEI, FTB, JourneyMap...) as runtime deps.
    // Create's real runtime dependencies are declared explicitly below.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    runtimeOnly "dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    // Optional integrations: compile against their APIs, present only in dev runs (never required by players)
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Farmer's Delight and its crop add-ons: optional. Their Cultivar data only loads when they're present
    // (neoforge:conditions). They're in the dev runtime by default; -Pwith_delight=false tests the absent path.
    compileOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"
    if (project.findProperty('with_delight') != 'false') {
        runtimeOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"
        runtimeOnly "maven.modrinth:expanded-delight:${expanded_delight_version}"
        runtimeOnly "maven.modrinth:rustic-delight:${rustic_delight_version}"
        runtimeOnly "maven.modrinth:my-nethers-delight:${my_nethers_delight_version}"
    }
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Guard: common code must never import client-only classes, or dedicated servers crash on load.
// Anything under a `client` package (or `mixin/client`) is exempt.
tasks.register('checkSidedness') {
    group = 'verification'
    description = 'Fails if code outside a client package imports client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    doLast {
        def pattern = ~/^\s*import\s+(static\s+)?(net\.minecraft\.client|com\.mojang\.blaze3d|net\.neoforged\.neoforge\.client)\..*/
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = srcDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.contains('/client/')) return
            f.eachLine { line, n ->
                if (line ==~ pattern) offenders << "${rel}:${n}: ${line.trim()}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Client-only imports outside a client package:\n  " + offenders.join('\n  '))
        }
    }
}
// Layering rules that keep features pluggable. See docs/EXTENSION_POINTS.md.
//   api/**          -> only api/ (plus Minecraft, NeoForge, DFU, JDK): addons compile against it alone
//   content/core/** -> api/, core/ and content/core/ only: shared rules never reach into a feature module
//   core/**         -> content/core/ at most (the module list and datagen bootstraps may wire features in)
tasks.register('checkModuleBoundaries') {
    group = 'verification'
    description = 'Fails if a package imports across a layering boundary (api purity, core independence).'
    def root = file("src/main/java/com/kragnoth/${mod_id}")
    def base = "com.kragnoth.${mod_id}"
    inputs.dir(root)
    doLast {
        def offenders = []
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            f.eachLine { line, n ->
                def m = line =~ /^\s*import\s+(?:static\s+)?${java.util.regex.Pattern.quote(base)}\.([\w.]+);/
                def refs = m.find() ? [m.group(1)] : []
                (line =~ /${java.util.regex.Pattern.quote(base)}\.([a-z_]+(?:\.[a-z_]+)*)\.[A-Z]/).each { refs << it[1] + '.X' }
                refs.each { String target ->
                    def t = target.replace('.', '/')
                    boolean bad = false
                    if (rel.startsWith('api/')) bad = !t.startsWith('api/')
                    else if (rel.startsWith('content/core/')) bad = t.startsWith('content/') && !t.startsWith('content/core/') || t.startsWith('client/') || t.startsWith('compat/')
                    else if (rel.startsWith('core/') && !rel.startsWith('core/module/') && !rel.startsWith('core/datagen/')) bad = t.startsWith('content/') && !t.startsWith('content/core/') || t.startsWith('compat/')
                    if (bad) offenders << "${rel}:${n} -> ${target}"
                }
            }
        }
        if (offenders) {
            throw new GradleException("Module boundary violations:\n  " + offenders.unique().join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn 'checkSidedness', 'checkModuleBoundaries' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
