plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Ponder, Flywheel
    maven { url = 'https://maven.createmod.net' }
    // Registrate (transitive dependency of Create)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // JEI
    maven { url = 'https://maven.blamejared.com' }
    // Modrinth maven (Jade)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // NeoForge config API port (transitive dependency of Ponder)
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Non-transitive: some Create POMs leak optional compat mods (JEI, FTB, JourneyMap...) as runtime deps.
    // Create's real runtime dependencies are declared explicitly below.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    runtimeOnly "dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    // Optional integrations: compile against their APIs, present only in dev runs (never required by players)
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Guard: common code must never import client-only classes, or dedicated servers crash on load.
// Anything under a `client` package (or `mixin/client`) is exempt.
tasks.register('checkSidedness') {
    group = 'verification'
    description = 'Fails if code outside a client package imports client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    doLast {
        def pattern = ~/^\s*import\s+(static\s+)?(net\.minecraft\.client|com\.mojang\.blaze3d|net\.neoforged\.neoforge\.client)\..*/
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = srcDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.contains('/client/')) return
            f.eachLine { line, n ->
                if (line ==~ pattern) offenders << "${rel}:${n}: ${line.trim()}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Client-only imports outside a client package:\n  " + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkSidedness' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
